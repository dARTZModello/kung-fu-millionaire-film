<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KFM$ Dance Animals — Mint</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Outfit:wght@400;500;600&display=swap">
<style>
:root { --ink:#07060c; --panel:#14111c; --line:#2c2640; --fg:#f6f3ee; --muted:#9b94a8; --magenta:#ff2d95; --cyan:#00e5ff; --gold:#ffd166; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--fg); font-family: Outfit, "Segoe UI", sans-serif; }
body { min-height: 100vh; background-image: linear-gradient(rgba(0,229,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,.04) 1px, transparent 1px); background-size: 28px 28px; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
header { position: sticky; top: 0; z-index: 2; background: rgba(7,6,12,.94); border-bottom: 1px solid var(--line); }
.bar, main { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
.bar { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; padding: .85rem 0; }
.brand { font-family: Oswald, "Arial Narrow", sans-serif; letter-spacing: .04em; color: var(--gold); font-size: 1.3rem; }
.nav a, .chip, .btn { min-height: 44px; display: inline-flex; align-items: center; border-radius: 999px; padding: 0 1rem; border: 1px solid var(--line); }
.nav a.on, .chip.on { background: var(--magenta); color: var(--ink); border-color: transparent; }
h1, h2, .code { font-family: Oswald, "Arial Narrow", sans-serif; font-weight: 500; }
h1 { font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); max-width: 40rem; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
input { width: min(100%, 24rem); min-height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); padding: 0 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .75rem; padding-bottom: 3rem; }
.card { display: flex; flex-direction: column; gap: .35rem; background: var(--panel); border: 1px solid rgba(255,209,102,.45); border-radius: 1rem; padding: .75rem; min-height: 100%; }
.card svg { width: 100%; height: 9rem; }
.code { color: var(--cyan); letter-spacing: .12em; }
.dance { color: var(--gold); margin: 0; }
.muted { color: var(--muted); }
.stage { display: grid; gap: 1.25rem; padding: 1.25rem 0 3rem; }
@media (min-width: 900px) { .stage { grid-template-columns: 22rem 1fr; align-items: start; } }
.plate { background: var(--panel); border: 1px solid rgba(255,209,102,.5); border-radius: 1rem; padding: 1rem; }
.plate svg { width: 100%; height: 16rem; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
.btn.primary { background: var(--magenta); color: var(--ink); border-color: transparent; font-weight: 600; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.ledger { list-style: none; padding: 0; margin: .5rem 0 0; border: 1px solid var(--line); border-radius: 1rem; max-height: 22rem; overflow: auto; }
.ledger button { width: 100%; min-height: 44px; display: flex; justify-content: space-between; gap: 1rem; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 0 1rem; text-align: left; }
.serial { color: var(--gold); font-size: .8rem; }
</style>
</head>
<body>
<header><div class="bar">
  <div><div class="brand">KFM$</div><div class="muted">50 LED dance animals</div></div>
  <nav class="nav"><a href="gallery.html" data-nav="gallery">Gallery</a><a href="mint.html" data-nav="mint">Mint</a></nav>
  <div class="muted" id="count"></div>
</div></header>
<main class="stage">
  <article class="plate" id="face"></article>
  <section>
    <p class="code" id="index"></p>
    <h1 id="title"></h1>
    <p class="dance" id="meta"></p>
    <p class="sub" id="line"></p>
    <p id="serial">Unminted</p>
    <div class="actions">
      <button class="btn" id="turn" type="button">Turn</button>
      <button class="btn primary" id="mint" type="button">Mint serial</button>
      <button class="btn" id="prev" type="button">Previous</button>
      <button class="btn" id="next" type="button">Next</button>
      <button class="btn" id="open" type="button">Next open</button>
    </div>
    <h2>Serial ledger</h2>
    <ul class="ledger" id="ledger"></ul>
  </section>
</main>

fill=\"none\" stroke=\"#ffd166\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ccircle cx=\"40\" cy=\"24\" r=\"7\" fill=\"none\" stroke=\"#ffd166\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M34,32 Q18,22 24,40\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M46,32 Q62,22 56,40\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M14,104 H66\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>"}];
const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function load() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } }
function save(m) { localStorage.setItem(KEY, JSON.stringify(m)); }
function serial(code) {
  const bytes = new Uint8Array(4); crypto.getRandomValues(bytes);
  let t = ""; for (const b of bytes) t += ALPHA[b % ALPHA.length];
  return "KFM$-" + code + "-" + t;
}
function mintedCount() { document.getElementById("count").textContent = Object.keys(load()).length + "/50 minted"; }

let flipped = false;
function current() {
  const code = new URLSearchParams(location.search).get("plate");
  return PLATES.find((p) => p.code === code) || PLATES[0];
}
function go(code) { location.href = "mint.html?plate=" + code; }
function render() {
  const plate = current();
  const mints = load();
  const rec = mints[plate.code];
  const face = document.getElementById("face");
  face.innerHTML = flipped
    ? `<p class="code">KFM$ · HEX LAB</p><h2>${plate.n} / 50</h2><p class="sub">${plate.line}</p><p class="code">${rec ? rec.serial : "UNMINTED"}</p><p class="muted">${plate.family}</p>`
    : `<div class="code">${plate.code}</div>${plate.svg}<h2>${plate.title}</h2><p class="dance">${plate.dance}</p><p class="muted">${plate.animal}</p>`;
  document.getElementById("index").textContent = "Plate " + plate.n + " / 50";
  document.getElementById("title").textContent = plate.title;
  document.getElementById("meta").textContent = plate.animal + " · " + plate.dance;
  document.getElementById("line").textContent = plate.line;
  document.getElementById("serial").textContent = rec ? rec.serial : "Unminted";
  const mintBtn = document.getElementById("mint");
  mintBtn.disabled = Boolean(rec);
  mintBtn.textContent = rec ? "Minted" : "Mint serial";
  document.getElementById("turn").textContent = flipped ? "Show face" : "Turn";
  const rows = Object.values(mints).sort((a, b) => b.at - a.at);
  document.getElementById("ledger").innerHTML = rows.length
    ? rows.map((r) => `<li><button type="button" data-code="${r.code}"><span><span class="code">${r.code}</span> ${(PLATES.find((p) => p.code === r.code) || {}).title || ""}</span><span class="serial">${r.serial}</span></button></li>`).join("")
    : "<li><span class='muted' style='display:block;padding:1rem'>Nothing minted in this browser yet.</span></li>";
  mintedCount();
}
document.getElementById("turn").onclick = () => { flipped = !flipped; render(); };
document.getElementById("mint").onclick = () => {
  const plate = current(); const mints = load();
  if (!mints[plate.code]) { mints[plate.code] = { code: plate.code, serial: serial(plate.code), at: Date.now() }; save(mints); }
  render();
};
document.getElementById("prev").onclick = () => { const i = PLATES.findIndex((p) => p.code === current().code); go(PLATES[(i + PLATES.length - 1) % PLATES.length].code); };
document.getElementById("next").onclick = () => { const i = PLATES.findIndex((p) => p.code === current().code); go(PLATES[(i + 1) % PLATES.length].code); };
document.getElementById("open").onclick = () => {
  const mints = load(); const i = PLATES.findIndex((p) => p.code === current().code);
  for (let s = 1; s <= PLATES.length; s++) { const p = PLATES[(i + s) % PLATES.length]; if (!mints[p.code]) { go(p.code); return; } }
};
document.getElementById("ledger").onclick = (e) => { const b = e.target.closest("button"); if (b) go(b.dataset.code); };
document.querySelector('[data-nav="mint"]').classList.add("on");
render();
</script>
